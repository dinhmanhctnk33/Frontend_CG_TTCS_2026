<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style_3.css">
    <title>Document</title>
</head>
<body>
    <h1>Thi nghiem Block and Inline</h1>
    <h2>Phan tu Block (su dung &lt;div&gt;)</h2>
    <div class="box block-box">Block 1</div>
    <div class="box block-box">Block 2</div>
    <hr><h2>Phan tu Inline (su dung &lt;span&gt;)</h2>
    <p>
        Day la mot doan van ban chua
        <span class="box inline-box">Inline 1</span>
        va
        <span class="box inline-box">Inline 2</span>
        de so sanh su khac nhau giua cac phan tu Block va Inline.
    </p>
</body>
</html>
